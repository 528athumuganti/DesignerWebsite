    <script>
  window.addEventListener('scroll', () => {
    // FIX: Look for class .index-bg instead of ID #bg-layer
    const bgLayer = document.querySelector('.fame-bg');
    if (!bgLayer) return;

    const fadeDistance = 400; 
    const currentScroll = window.scrollY;

    let opacity = 1 - (currentScroll / fadeDistance);
    if (opacity < 0) opacity = 0;

    bgLayer.style.opacity = opacity;
  });
</script>
