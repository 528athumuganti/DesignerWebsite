    <script>
  window.addEventListener('scroll', function() {
    // Distance in pixels over which the image fully fades to black
    const fadeDistance = 400; 
    
    const scrollPosition = window.scrollY;
    
    // Calculate opacity (1 at top, 0 at fadeDistance)
    let opacity = 1 - (scrollPosition / fadeDistance);
    
    // Keep opacity bounded between 0 and 1
    if (opacity < 0) opacity = 0;
    if (opacity > 1) opacity = 1;
    
    // Apply opacity change ONLY to the background pseudo-element
    document.documentElement.style.setProperty('--bg-opacity', opacity);
  });
</script>
